[project]
name = "anticharon"
version = "0.5.4"
description = "OpenRouter model price tracker, volatility detector, and token cost optimizer for Hermes Agent and MCP pipelines"
readme = "README.md"
authors = [
    { name = "Páris Piedade Neto" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "mcp>=1.3.0",
]

[dependency-groups]
# PE2-010: pytest/ruff are development-only tools -- moved out of the
# runtime `dependencies` array (where they previously sat) so an end user
# running `uv tool install`/`pip install` never pulls them in; `uv sync` in
# this repo still installs this group by default, so local development is
# unaffected. See docs/plans/pricing-engine-v2/RELEASE_VALIDATION.md#PE2-010.
dev = [
    "ruff>=0.16.7",
    "pytest>=9.1.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
]

[project.scripts]
anticharon = "anticharon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anticharon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-m 'not live'"
markers = [
    "live: live network contract tests (run explicitly with -m live)",
]
