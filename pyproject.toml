[project]
name = "anticharon"
version = "0.5.2"
description = "OpenRouter model price tracker, volatility detector, and token cost optimizer for Hermes Agent and MCP pipelines"
readme = "README.md"
authors = [
    { name = "Páris Piedade Neto" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "mcp>=1.3.0",
    "ruff>=0.16.7",
    "pytest>=9.1.1",
]

[project.scripts]
anticharon = "anticharon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anticharon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-m 'not live'"
markers = [
    "live: live network contract tests (run explicitly with -m live)",
]
